name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a branch/PR cancels its previous run; every commit on main
# keeps its own result, so main's runs get a group per commit: in a shared
# group a run waits for the one in progress, and the next merge cancels it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  # No debuginfo in CI: dependencies are built at opt-level 2, where debuginfo
  # is the expensive part; it also keeps target/ (and the cache) small.
  # Panic messages still carry file:line.
  CARGO_PROFILE_DEV_DEBUG: "0"

# The toolchain (version + components) comes from rust-toolchain.toml.
# GPUI is built with `runtime_shaders`, so no Xcode/Metal toolchain is needed.
#
# Caching (Swatinem/rust-cache, one cache per job): ~/.cargo registry + the
# compiled dependencies in target/, keyed by toolchain + Cargo.lock. Saved from
# any run — PRs and failed runs too — but only when that key is not cached yet,
# i.e. on new dependencies or a new toolchain. A PR sees its own caches and
# main's; main sees only its own.

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup toolchain install && rustc --version
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup toolchain install && rustc --version
      # libghostty-vt (crates/sg_terminal) builds with Zig; the release it
      # builds from is a Zig package (crates/sg_terminal/ghostty/build.zig.zon).
      - uses: ./.github/actions/setup-zig
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # --all-features also covers the `screenshot` feature.
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: build & test
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup toolchain install && rustc --version
      # libghostty-vt (crates/sg_terminal) builds with Zig; the release it
      # builds from is a Zig package (crates/sg_terminal/ghostty/build.zig.zon).
      - uses: ./.github/actions/setup-zig
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build
        run: cargo build --workspace --all-targets --locked
      # Live tests against the real `claude` CLI are #[ignore]d and stay off.
      - name: Test
        run: cargo test --workspace --locked

  bundle:
    name: release bundle
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup toolchain install && rustc --version
      # libghostty-vt (crates/sg_terminal) builds with Zig; the release it
      # builds from is a Zig package (crates/sg_terminal/ghostty/build.zig.zon).
      - uses: ./.github/actions/setup-zig
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build SuperGIT.app
        run: scripts/bundle-macos.sh
      - name: Verify bundle
        run: |
          app=target/release/bundle.noindex/SuperGIT.app
          codesign --verify --strict --verbose=2 "$app"
          plutil -lint "$app/Contents/Info.plist"
          file "$app/Contents/MacOS/supergit"

  # Single status for branch protection / merge rules: require only this check.
  ci-ok:
    name: CI ok
    if: always()
    needs: [fmt, clippy, test, bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do [[ "$r" == success ]] || exit 1; done
