[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/supergit"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false

[workspace.dependencies]
sg_git = { path = "crates/sg_git" }
sg_github = { path = "crates/sg_github" }
sg_agents = { path = "crates/sg_agents" }
sg_claude = { path = "crates/sg_claude" }
sg_codex = { path = "crates/sg_codex" }
sg_terminal = { path = "crates/sg_terminal" }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `syntect`: syntax highlighting in diffs and code blocks (~200 languages,
# including Clojure, for a few MB — the tree-sitter set costs tens).
gpui-kit = { version = "0.9.1", features = ["syntect"] }
futures = "0.3"

# Guardrails for agent-written code (warnings fail CI). Silence one only with
# `#[expect(clippy::…, reason = "…")]` at the narrowest scope — never `#[allow]`.
[workspace.lints.clippy]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# A panic is an app crash: use `?`, or `expect("why this holds")` for invariants.
# Tests may unwrap (clippy.toml; integration-test files opt in with `#![expect]`).
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# stdout belongs to `--dump`/`--help`; stray debug prints stay out of the app.
print_stdout = "warn"
undocumented_unsafe_blocks = "warn"
# `foo.rs` + `foo/`, not `foo/mod.rs`.
mod_module_files = "warn"

[profile.dev]
# Keep our crates debuggable but make dependencies (gpui, tree-sitter…) fast.
opt-level = 0

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 16
