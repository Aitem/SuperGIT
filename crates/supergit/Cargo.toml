[package]
name = "supergit"
description = "SuperGIT — Git GUI for agent-driven development (worktrees, Claude Code and Codex sessions, commits, PRs)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "supergit"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
# Local times of chat messages.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
gpui-kit.workspace = true
sg_git.workspace = true
sg_github.workspace = true
sg_agents.workspace = true
sg_claude.workspace = true
sg_codex.workspace = true
sg_terminal.workspace = true
# Release tags against the running version (update checks).
semver = "1"
# Downloaded updates against the release's SHA256SUMS.
sha2 = "0.10"
# Session ids for new terminal conversations (`claude --session-id`).
uuid = { version = "1", features = ["v4"] }
# Syntax colors for the difftastic view; the same versions as gpui-kit's
# `syntect` highlighter. `regex-onig` switches both to Oniguruma (syntect
# prefers it over fancy-regex): fancy-regex builds automata per pattern,
# ~30 MB for one language's patterns against ~1 MB.
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "default-syntaxes", "regex-fancy", "regex-onig"] }
two-face = { version = "0.4.5", default-features = false, features = ["syntect-fancy"] }
# Only for the `screenshot` feature: turns on GPUI's `render_to_image`.
gpui_platform_test_support = { package = "gpui-pre-platform", version = "=0.3.12", features = ["test-support"], optional = true }

# macOS notifications (src/notifications/macos.rs) and sounds (src/sound/macos.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSSound"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSBundle", "NSObject", "NSString", "NSError"] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "UNUserNotificationCenter", "UNNotification", "UNNotificationRequest", "UNNotificationContent", "UNNotificationResponse", "UNNotificationTrigger", "block2"] }
block2 = "0.6"

# Desktop notifications (src/notifications/freedesktop.rs); the version GPUI's
# Linux platform already builds.
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
notify-rust = "4.19"

[features]
git2-probe = ["sg_git/git2-probe"]
# `SUPERGIT_SCREENSHOT=out.png supergit` renders the window to a PNG and quits.
# Used to check the UI without screen-recording permission (agents, CI).
screenshot = ["dep:gpui_platform_test_support"]

[lints]
workspace = true
